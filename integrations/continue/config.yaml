# Continue.dev (VS Code / JetBrains) — copia in ~/.continue/config.yaml
# Prerequisiti:  `mydevagent serve` in esecuzione  +  Ollama con i modelli del tuo profilo
name: MyDevAgent
version: 1.0.0
schema: v1

models:
  # Chat: il team completo a 15 agenti (router automatico fast/balanced/deep)
  - name: MyDevAgent (team 15 agenti)
    provider: openai
    model: mydevagent
    apiBase: http://127.0.0.1:8000/v1
    apiKey: local            # metti MYDEVAGENT_API_KEY se l'hai impostata
    roles: [chat]
    defaultCompletionOptions:
      contextLength: 16384
      maxTokens: 4096

  # Deep: forza la pipeline completa (architettura, security, performance, edge case, docs)
  - name: MyDevAgent Deep
    provider: openai
    model: mydevagent-deep
    apiBase: http://127.0.0.1:8000/v1
    apiKey: local
    roles: [chat]

  # Edit / Apply inline: 1 sola chiamata → veloce
  - name: MyDevAgent Fast
    provider: openai
    model: mydevagent-fast
    apiBase: http://127.0.0.1:8000/v1
    apiKey: local
    roles: [chat, edit, apply]

  # Autocomplete (tab): modello BASE piccolo con FIM, direttamente da Ollama → latenza ~100-300 ms
  - name: Qwen2.5-Coder 1.5B (autocomplete)
    provider: ollama
    model: qwen2.5-coder:1.5b-base
    roles: [autocomplete]
    autocompleteOptions:
      debounceDelay: 250
      maxPromptTokens: 1024
      onlyMyCode: true

  # Embeddings per @codebase
  - name: Nomic Embed
    provider: ollama
    model: nomic-embed-text
    roles: [embed]

context:
  - provider: code
  - provider: diff
  - provider: terminal
  - provider: problems
  - provider: folder
  - provider: codebase
  - provider: currentFile

rules:
  - Rispondi in italiano, codice e commenti in inglese.
  - Usa i tag @security @perf @db @web nel messaggio per coinvolgere agenti specifici.
