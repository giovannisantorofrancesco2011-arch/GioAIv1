# MyDevAgent full stack: Ollama (modelli) + SearXNG (ricerca web gratuita e privata) + server MyDevAgent
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml exec ollama ollama pull qwen2.5-coder:7b
#   (ripeti per qwen2.5-coder:1.5b e nomic-embed-text)  →  http://localhost:8000/v1
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports: ["127.0.0.1:11434:11434"]
    volumes: [ollama:/root/.ollama]
    environment:
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_NUM_PARALLEL: "3"        # agenti in parallelo sullo stesso modello
      OLLAMA_CONTEXT_LENGTH: "16384"
    # GPU NVIDIA (richiede nvidia-container-toolkit): togli il commento
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./searxng/settings.yml:/etc/searxng/settings.yml:ro"]

  mydevagent:
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    depends_on: [ollama, searxng]
    ports: ["127.0.0.1:8000:8000"]
    environment:
      LLM_BASE_URL: "http://ollama:11434/v1"
      SEARXNG_URL: "http://searxng:8080"
      MYDEVAGENT_PROFILE: "${MYDEVAGENT_PROFILE:-gpu8}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      FIRECRAWL_API_KEY: "${FIRECRAWL_API_KEY:-}"
      MYDEVAGENT_API_KEY: "${MYDEVAGENT_API_KEY:-}"
    # La sandbox Docker dentro al container richiede il socket di Docker: dà al container
    # il controllo del daemon dell'host. Abilitalo solo se sai cosa fai.
    # volumes: ["/var/run/docker.sock:/var/run/docker.sock"]

volumes:
  ollama:
